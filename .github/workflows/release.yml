# A release's tag runs this repository's release verb where the tag is seen. The verb checks the skills
# against the release, and its line is the run's output the release command collects.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The verb reads the release tag that names the commit.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - run: just release > manifest-lines.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-lines
          path: manifest-lines.jsonl
